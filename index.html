<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HPC & IA Specialist - Guia Definitivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712; --card: #0f172a; --border: #1e293b; --text: #e2e8f0;
    --dim: #94a3b8; --primary: #3b82f6; --success: #22c55e; --warning: #eab308; --danger: #ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter', sans-serif;overflow-x:hidden}
  code, pre { font-family: 'IBM Plex Mono', monospace; }
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:#0d1117}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
  @keyframes fIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .pipeline-step { position: relative; padding-bottom: 30px; }
  .pipeline-step:not(:last-child)::after {
    content: '↓'; position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%);
    color: var(--dim); font-size: 24px; font-weight: 800;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; border-radius: 8px; overflow: hidden; }
  th, td { padding: 14px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
  th { background: #1e293b; color: #fff; text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; }
  tr:hover { background: #1e293b30; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const UI = {
  Card: ({ children, onClick, active, color }) => (
    <button onClick={onClick} style={{
      background: active ? `${color}15` : "var(--card)",
      border: active ? `1px solid ${color}` : "1px solid var(--border)",
      borderRadius: 12, padding: "20px", cursor: "pointer", textAlign: "left",
      transition: "all 0.2s", color: "inherit", display: "flex", flexDirection: "column", gap: 8
    }}>{children}</button>
  ),
  Tabs: ({ tabs, activeTab, onTabChange, color }) => (
    <div style={{ display: "flex", borderBottom: "1px solid var(--border)", padding: "0 20px" }}>
      {tabs.map(t => (
        <button key={t} onClick={() => onTabChange(t)} style={{
          background: "none", border: "none",
          borderBottom: activeTab === t ? `2px solid ${color}` : "2px solid transparent",
          color: activeTab === t ? color : "var(--dim)",
          padding: "12px 14px", cursor: "pointer", fontSize: 12, fontWeight: 600,
          textTransform: "uppercase"
        }}>{t}</button>
      ))}
    </div>
  ),
  Code: ({ code, title }) => (
    <div style={{ background: "#030508", borderRadius: 8, border: "1px solid var(--border)", overflow: "hidden", marginTop: 12 }}>
      <div style={{ padding: "8px 12px", borderBottom: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", gap: 6 }}>
          {[1,2,3].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:i===1?"#ff5f57":i===2?"#ffbd2e":"#28c840"}}/>)}
        </div>
        <span style={{ fontSize: 10, color: "var(--dim)" }}>{title || "bash / python"}</span>
      </div>
      <pre style={{ padding: "16px", margin: 0, fontSize: 13, color: "#7dd3fc", overflowX: "auto" }}><code>{code}</code></pre>
    </div>
  ),
  Link: ({ href, text }) => (
    <a href={href} target="_blank" rel="noopener noreferrer" style={{
      background: "#1e293b", border: "1px solid var(--border)", padding: "8px 14px", borderRadius: 8,
      color: "var(--primary)", textDecoration: "none", fontSize: 12, display: "inline-flex", alignItems: "center", gap: 6, fontWeight: 600, transition: "all 0.2s"
    }}>
      {text} ↗
    </a>
  )
};

const Guide = ({ data }) => {
  const [activeId, setActiveId] = React.useState(null);
  const [tab, setTab] = React.useState("conceito");
  const item = data.items.find(i => i.id === activeId);

  return (
    <div style={{animation:"fIn 0.3s ease"}}>
      <div style={{marginBottom:32, textAlign:"center"}}>
        <h2 style={{fontSize:28, color:"#fff", marginBottom:8, fontWeight: 800}}>{data.title}</h2>
        <p style={{color:"var(--dim)", fontSize:16, maxWidth: 650, margin: "0 auto"}}>{data.subtitle}</p>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(260px, 1fr))", gap:12, marginBottom:32}}>
        {data.items.map((s, idx) => (
          <UI.Card key={s.id} onClick={()=>{setActiveId(s.id); setTab("conceito")}} active={activeId===s.id} color={s.color}>
            <div style={{fontSize:10, color:s.color, fontWeight: 700, letterSpacing: "0.1em"}}>MÓDULO {String(idx+1).padStart(2,"0")}</div>
            <div style={{fontSize:18, fontWeight:700, color:activeId===s.id?s.color:"#fff"}}>{s.emoji} {s.title}</div>
            <div style={{fontSize:12, color:"var(--dim)", lineHeight: 1.4}}>{s.subtitle}</div>
          </UI.Card>
        ))}
      </div>
      {item && (
        <div style={{background:"var(--card)", border:`1px solid ${item.color}40`, borderRadius:16, overflow:"hidden", boxShadow: "0 10px 30px -10px rgba(0,0,0,0.5)"}}>
          <div style={{padding:"20px 24px", borderBottom:"1px solid var(--border)", background:`linear-gradient(135deg, ${item.color}10, transparent)`, display:"flex", justifyContent:"space-between", alignItems: "center"}}>
            <div>
                <h3 style={{fontSize:20, color:item.color, fontWeight: 700}}>{item.emoji} {item.title}</h3>
                <p style={{fontSize: 12, color: "var(--dim)", marginTop: 2}}>{item.subtitle}</p>
            </div>
            <button onClick={()=>setActiveId(null)} style={{background:"none", border:"1px solid var(--border)", color:"var(--dim)", cursor:"pointer", padding:"6px 12px", borderRadius:8, fontSize: 12}}>fechar ×</button>
          </div>
          <UI.Tabs tabs={["conceito", "detalhes", "montagem"]} activeTab={tab} onTabChange={setTab} color={item.color} />
          <div style={{padding:"24px"}}>
            {tab==="conceito" && (
              <div>
                <div style={{fontSize:15, color:"var(--text)", marginBottom:20, lineHeight: 1.6, background: "#1e293b50", padding: 16, borderRadius: 12, borderLeft: `4px solid ${item.color}`}}>
                    <strong>💡 Analogia:</strong> {item.analogy}
                </div>
                <p style={{fontSize: 15, color: "#fff", marginBottom: 16}}>{item.what}</p>
                <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))", gap:12}}>
                  {item.points.map((p,i)=><div key={i} style={{padding:"14px", background:"#0a0f1a", border:"1px solid var(--border)", borderRadius:10, fontSize:13, color:"var(--dim)", lineHeight: 1.5}}>
                    <strong style={{color: item.color, display: "block", marginBottom: 4}}>◆ Ponto {i+1}</strong>
                    {p}
                  </div>)}
                </div>
              </div>
            )}
            {tab==="detalhes" && (
                <div style={{fontSize:15, lineHeight:1.8, color:"var(--text)"}}>
                    <h4 style={{fontSize: 14, color: item.color, textTransform: "uppercase", marginBottom: 12, letterSpacing: "0.05em"}}>{item.deepDive.title}</h4>
                    <div style={{whiteSpace:"pre-wrap", background: "#00000040", padding: 20, borderRadius: 12}}>{item.deepDive.content}</div>
                </div>
            )}
            {tab==="montagem" && (
              <div>
                <h4 style={{fontSize: 14, color: item.color, textTransform: "uppercase", marginBottom: 16}}>Guia de Implementação & Documentação Oficial</h4>
                <div style={{display: "grid", gap: 16}}>
                    <div style={{background: "#1e293b40", padding: 16, borderRadius: 12, border: "1px solid var(--border)"}}>
                        <p style={{fontSize: 13, marginBottom: 12, color: "#fff"}}>Acesse os links abaixo para baixar repositórios, ler papers técnicos e guias de instalação:</p>
                        <div style={{display: "flex", flexWrap: "wrap", gap: 10}}>
                            {item.links.map((l, i) => <UI.Link key={i} href={l.url} text={l.name} />)}
                        </div>
                    </div>
                    <UI.Code title={item.implementation.title} code={item.implementation.code} />
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

const DecisionView = () => {
  const steps = [
    { name: "1. RAG (Retrieval Augmented Generation)", cost: "€50–€500", quality: "Média/Alta", time: "1–3 dias", desc: "Use quando precisa responder com documentos próprios (PDFs, Patentes, Research) sem alterar o modelo." },
    { name: "2. Fine-tuning leve (LoRA / QLoRA)", cost: "€100–€2.000", quality: "Boa", time: "1–7 dias", desc: "Ideal para adaptar o estilo, tom de voz ou formato de saída (JSON, SQL) usando datasets pequenos." },
    { name: "3. Full Fine-tuning", cost: "€2.000–€30.000+", quality: "Alta", time: "1–4 semanas", desc: "Muda o comportamento profundo e ensina novas habilidades complexas ao modelo." },
    { name: "4. Continued Pre-training", cost: "€20.000–€250.000+", quality: "Muito Alta", time: "Semanas/Meses", desc: "Ensina conhecimento técnico/científico denso que não existe na internet comum (ex: Quantum Computing)." },
    { name: "5. Pre-training Zero", cost: "Milhões €", quality: "Máxima", time: "Meses", desc: "Criar o seu próprio Foundation Model. Requer infraestrutura massiva e equipe de PhDs." }
  ];

  return (
    <div style={{animation:"fIn 0.3s ease"}}>
      <div style={{textAlign:"center", marginBottom: 40}}>
        <h2 style={{fontSize:32, color:"#fff", marginBottom:8, fontWeight: 800}}>Estratégia de Decisão LLM</h2>
        <p style={{color:"var(--dim)", fontSize:16}}>Matriz de investimento e pipeline recomendado para projetos corporativos.</p>
      </div>

      <div style={{display:"grid", gap:32}}>
        <section>
          <h3 style={{fontSize: 18, marginBottom: 20, color: "var(--primary)", textTransform: "uppercase", letterSpacing: "0.05em"}}>1. Pipeline Visual de Decisão</h3>
          <div style={{display: "flex", flexDirection: "column", gap: 12}}>
            {steps.map((s, i) => (
              <div key={i} className="pipeline-step" style={{background: "var(--card)", padding: 24, borderRadius: 16, border: "1px solid var(--border)"}}>
                <div style={{display: "flex", justifyContent: "space-between", marginBottom: 8}}>
                  <strong style={{fontSize: 18, color: "#fff"}}>{s.name}</strong>
                  <span style={{fontSize: 12, padding: "4px 10px", borderRadius: 20, background: "#000", border: `1px solid ${varColor(s.cost)}`, color: varColor(s.cost)}}>{s.cost}</span>
                </div>
                <p style={{fontSize: 14, color: "var(--dim)", marginBottom: 16, lineHeight: 1.5}}>{s.desc}</p>
                <div style={{display: "flex", gap: 24, fontSize: 12, color: "#fff"}}>
                  <span style={{background: "#ffffff10", padding: "4px 8px", borderRadius: 6}}>⏱️ <strong>Tempo:</strong> {s.time}</span>
                  <span style={{background: "#ffffff10", padding: "4px 8px", borderRadius: 6}}>⭐ <strong>Qualidade:</strong> {s.quality}</span>
                </div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h3 style={{fontSize: 18, marginBottom: 20, color: "var(--primary)", textTransform: "uppercase"}}>2. Matriz de Estratégia</h3>
          <div style={{overflowX: "auto", background: "var(--card)", borderRadius: 16, border: "1px solid var(--border)"}}>
            <table>
              <thead>
                <tr><th>Estratégia</th><th>Melhor Para</th><th>Custo</th><th>Qualidade</th><th>Risco</th></tr>
              </thead>
              <tbody>
                <tr><td><strong>RAG</strong></td><td>Documentos, patentes, research, PDFs</td><td>Baixo</td><td>Boa</td><td style={{color: "var(--success)"}}>Baixo</td></tr>
                <tr><td><strong>LoRA / QLoRA</strong></td><td>Adaptar Qwen / SynapseX</td><td>Baixo/médio</td><td>Boa</td><td style={{color: "var(--warning)"}}>Médio</td></tr>
                <tr><td><strong>FT Completo</strong></td><td>Produtos comerciais críticos</td><td>Médio/alto</td><td>Alta</td><td style={{color: "var(--warning)"}}>Alto</td></tr>
                <tr><td><strong>Continued PT</strong></td><td>LLM Científico / Quantum</td><td>Alto</td><td>Muito alta</td><td style={{color: "var(--danger)"}}>Alto</td></tr>
                <tr><td><strong>Do Zero</strong></td><td>Criar novo Foundation Model</td><td>Extremo</td><td>Incerto</td><td style={{color: "var(--danger)"}}>Muito alto</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section style={{background: "linear-gradient(135deg, #0f172a 0%, #030712 100%)", padding: 32, borderRadius: 20, border: "1px solid var(--success)40"}}>
          <div style={{display: "flex", alignItems: "center", gap: 12, marginBottom: 24}}>
            <div style={{width: 40, height: 40, borderRadius: "50%", background: "var(--success)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20}}>💎</div>
            <h3 style={{fontSize: 22, color: "#fff", fontWeight: 800}}>Pipeline Recomendado: SoftQuantus</h3>
          </div>
          <div style={{display: "grid", gap: 16}}>
            {[
              { f: "FASE 1 - RAG", d: "Indexar papers, documentação SynapseX, quantum notes e APIs. Objetivo: Resposta correta baseada em fontes." },
              { f: "FASE 2 - Dataset", d: "Curadoria de 5k a 50k exemplos estruturados: (Pergunta → Resposta Ideal), (Código → Correção)." },
              { f: "FASE 3 - QLoRA", d: "Treinar modelos (Qwen-72B ou Llama-3) em clusters A100/H100. Foco em linguagem técnica e raciocínio." },
              { f: "FASE 4 - Avaliação", d: "Métricas de precisão científica, benchmarks de código e latência de inferência." },
              { f: "FASE 5 - Deploy", d: "Infraestrutura vLLM / RunPod / Scaleway. API de alta escala cobrada por token ou assinatura." },
              { f: "FASE 6 - Feedback", d: "Coleta de logs, curadoria humana e re-treinamento cíclico mensal." }
            ].map((phase, i) => (
              <div key={i} style={{display: "flex", gap: 16, alignItems: "flex-start", background: "#ffffff05", padding: 16, borderRadius: 12, border: "1px solid #ffffff05"}}>
                <div style={{background: "var(--success)", color: "#000", padding: "4px 10px", borderRadius: 8, fontSize: 12, fontWeight: 900, marginTop: 4}}>F{i+1}</div>
                <div>
                  <strong style={{color: "#fff", display: "block", fontSize: 16, marginBottom: 4}}>{phase.f}</strong>
                  <span style={{fontSize: 14, color: "var(--dim)", lineHeight: 1.5}}>{phase.d}</span>
                </div>
              </div>
            ))}
          </div>
        </section>

        <div style={{display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 24}}>
          <section style={{background: "var(--card)", padding: 24, borderRadius: 16, border: "1px solid var(--border)"}}>
            <h3 style={{fontSize: 16, marginBottom: 16, color: "#fff", display: "flex", alignItems: "center", gap: 8}}>⚡ Custos de GPU (Lambda/RunPod)</h3>
            <div style={{display: "grid", gap: 12}}>
                <div style={{display: "flex", justifyContent: "space-between", background: "#000", padding: 12, borderRadius: 8}}>
                    <span style={{fontSize: 13}}>🚀 <strong>NVIDIA H100 (80GB)</strong></span>
                    <span style={{color: "var(--success)", fontWeight: 700}}>$3.99/h</span>
                </div>
                <div style={{display: "flex", justifyContent: "space-between", background: "#000", padding: 12, borderRadius: 8}}>
                    <span style={{fontSize: 13}}>⚡ <strong>NVIDIA A100 (80GB)</strong></span>
                    <span style={{color: "var(--success)", fontWeight: 700}}>$1.99/h</span>
                </div>
                <div style={{display: "flex", justifyContent: "space-between", background: "#000", padding: 12, borderRadius: 8}}>
                    <span style={{fontSize: 13}}>🏠 <strong>RTX 4090 (24GB)</strong></span>
                    <span style={{color: "var(--success)", fontWeight: 700}}>$0.74/h</span>
                </div>
            </div>
          </section>
          <section style={{background: "var(--card)", padding: 24, borderRadius: 16, border: "1px solid var(--border)"}}>
            <h3 style={{fontSize: 16, marginBottom: 16, color: "#fff"}}>💡 Regras de Decisão Prática</h3>
            <ul style={{fontSize: 14, color: "var(--dim)", display: "grid", gap: 12, listStyle: "none"}}>
              <li style={{display: "flex", gap: 10}}><span>✅</span> <strong>Conhecimento atualizado?</strong> → Use <strong>RAG</strong></li>
              <li style={{display: "flex", gap: 10}}><span>✅</span> <strong>Estilo e formato próprio?</strong> → Use <strong>LoRA</strong></li>
              <li style={{display: "flex", gap: 10}}><span>✅</span> <strong>Domínio técnico profundo?</strong> → Use <strong>Continued PT</strong></li>
              <li style={{display: "flex", gap: 10}}><span>✅</span> <strong>Criar nova OpenAI?</strong> → Use <strong>Pre-training Zero</strong></li>
            </ul>
          </section>
        </div>
      </div>
    </div>
  );
};

function varColor(cost) {
  if (cost.includes("Milhões") || cost.includes("Extremo")) return "var(--danger)";
  if (cost.includes("20.000")) return "var(--warning)";
  return "var(--success)";
}
