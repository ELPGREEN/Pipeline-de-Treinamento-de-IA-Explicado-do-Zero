<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Engenharia de IA & HPC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#080c14;color:#e2e8f0;font-family:'IBM Plex Mono',monospace;overflow-x:hidden}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:#0d1117}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
  @keyframes fIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const UI = {
  Card: ({ children, onClick, active, color }) => (
    <button onClick={onClick} style={{
      background: active ? `${color}15` : "#0d1117",
      border: active ? `1px solid ${color}` : "1px solid #1e293b",
      borderRadius: 12, padding: "16px", cursor: "pointer", textAlign: "left",
      transition: "all 0.2s", color: "inherit"
    }}>{children}</button>
  ),
  Tabs: ({ tabs, activeTab, onTabChange, color }) => (
    <div style={{ display: "flex", borderBottom: "1px solid #1e293b", padding: "0 20px" }}>
      {tabs.map(t => (
        <button key={t} onClick={() => onTabChange(t)} style={{
          background: "none", border: "none",
          borderBottom: activeTab === t ? `2px solid ${color}` : "2px solid transparent",
          color: activeTab === t ? color : "#475569",
          padding: "12px 14px", cursor: "pointer", fontSize: 12, fontWeight: 600,
          textTransform: "uppercase"
        }}>{t}</button>
      ))}
    </div>
  ),
  Code: ({ code }) => (
    <div style={{ background: "#030508", borderRadius: 8, border: "1px solid #1e293b", overflow: "hidden" }}>
      <div style={{ padding: "8px 12px", borderBottom: "1px solid #1e293b", display: "flex", gap: 6 }}>
        {[1,2,3].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:i===1?"#ff5f57":i===2?"#ffbd2e":"#28c840"}}/>)}
      </div>
      <pre style={{ padding: "16px", margin: 0, fontSize: 13, color: "#7dd3fc", overflowX: "auto" }}><code>{code}</code></pre>
    </div>
  )
};

const Guide = ({ data }) => {
  const [activeId, setActiveId] = React.useState(null);
  const [tab, setTab] = React.useState("conceito");
  const item = data.items.find(i => i.id === activeId);

  return (
    <div style={{animation:"fIn 0.3s ease"}}>
      <div style={{marginBottom:24, textAlign:"center"}}>
        <h2 style={{fontSize:22, color:"#e2e8f0", marginBottom:8}}>{data.title}</h2>
        <p style={{color:"#94a3b8", fontSize:14}}>{data.subtitle}</p>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))", gap:10, marginBottom:24}}>
        {data.items.map((s, idx) => (
          <UI.Card key={s.id} onClick={()=>{setActiveId(s.id); setTab("conceito")}} active={activeId===s.id} color={s.color}>
            <div style={{fontSize:10, color:s.color, fontWeight:700, opacity:0.6, marginBottom:4}}>ETAPA {String(idx+1).padStart(2,"0")}</div>
            <div style={{fontSize:14, fontWeight:700, color:activeId===s.id?s.color:"#cbd5e1"}}>{s.title}</div>
            <div style={{fontSize:11, color:"#64748b"}}>{s.subtitle}</div>
          </UI.Card>
        ))}
      </div>
      {item && (
        <div style={{background:"#0d1117", border:`1px solid ${item.color}30`, borderRadius:12, overflow:"hidden"}}>
          <div style={{padding:"16px 20px", borderBottom:"1px solid #1e293b", background:`linear-gradient(135deg, ${item.color}08, transparent)`, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <h3 style={{fontSize:16, color:item.color}}>{item.emoji} {item.title}</h3>
            <button onClick={()=>setActiveId(null)} style={{background:"none", border:"1px solid #334155", color:"#64748b", cursor:"pointer", padding:"2px 8px", borderRadius:6}}>fechar ×</button>
          </div>
          <UI.Tabs tabs={["conceito", "detalhes", "código"]} activeTab={tab} onTabChange={setTab} color={item.color} />
          <div style={{padding:"20px"}}>
            {tab==="conceito" && (
              <div>
                <p style={{fontSize:14, color:"#cbd5e1", marginBottom:16}}>💡 {item.analogy}</p>
                <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(200px, 1fr))", gap:8}}>
                  {item.points.map((p,i)=><div key={i} style={{padding:"10px", background:"#0a0f1a", border:"1px solid #1e293b", borderRadius:6, fontSize:13, color:"#94a3b8"}}>◆ {p}</div>)}
                </div>
              </div>
            )}
            {tab==="detalhes" && <div style={{fontSize:14, lineHeight:1.7, color:"#cbd5e1", whiteSpace:"pre-wrap"}}>{item.deepDive.content}</div>}
            {tab==="código" && <UI.Code code={item.deepDive.code} />}
          </div>
        </div>
      )}
    </div>
  );
};

const appData = {
  pipeline: {
    title: "Pipeline de Dados IA", subtitle: "A jornada do dado bruto até a inteligência.",
    items: [
      { id:1, emoji:"🌐", title:"Coleta", subtitle:"Material bruto", color:"#00d4ff", analogy:"Biblioteca de estudo.", points:["Bancos de dados", "APIs externas", "Scraping"], deepDive:{ content:"Dados ruins geram modelos ruins. O GPT-4 usou trilhões de tokens.", code:"def collect(): pass" }},
      { id:2, emoji:"🧹", title:"Limpeza", subtitle:"Preparação", color:"#22c55e", analogy:"Organizar páginas rasgadas.", points:["Deduplicação", "Remoção de PII", "Filtros"], deepDive:{ content:"90% do trabalho em LLM é limpeza de dados.", code:"def clean(t): return t.strip()" }},
      { id:3, emoji:"🚀", title:"Treino", subtitle:"Processamento", color:"#ef4444", analogy:"Estudante em maratona.", points:["Backpropagation", "Loss calculation", "Optimization"], deepDive:{ content:"A GPU ajusta pesos matemáticos para reduzir o erro.", code:"model.train()" }}
    ]
  },
  hpc: {
    title: "Engenharia HPC & Cluster", subtitle: "Como DeepSeek e Anthropic escalam para milhares de GPUs.",
    items: [
      { id:'fw', emoji:"🏗️", title:"Frameworks", subtitle:"DeepSpeed & Megatron", color:"#3b82f6", analogy:"Guindastes para prédios.", points:["DeepSpeed ZeRO", "Megatron-LM", "Distributed Training"], deepDive:{ content:"ZeRO divide estados do otimizador e pesos entre GPUs para economizar VRAM.", code:"zero_optimization: { stage: 3 }" }},
      { id:'tp', emoji:"🧠", title:"Aprendizado", subtitle:"SFT & GRPO", color:"#8b5cf6", analogy:"De aluno a mestre.", points:["Pre-training", "SFT (Instruções)", "GRPO (Raciocínio)"], deepDive:{ content:"O GRPO da DeepSeek elimina modelos de recompensa para treinar raciocínio lógico.", code:"grpo_loss = policy(advantages)" }},
      { id:'bt', emoji:"📦", title:"Batching", subtitle:"Micro & Global", color:"#10b981", analogy:"Linha de montagem industrial.", points:["Micro-batch (Local)", "Gradient Accumulation", "Global Batch"], deepDive:{ content:"Global Batch = Micro Batch * Grad Acc * GPUs.", code:"batch = micro * acc * nodes" }},
      { id:'hw', emoji:"🔌", title:"Hardware", subtitle:"H100 & NVLink", color:"#ef4444", analogy:"Autoestradas vs Estrada de terra.", points:["NVIDIA H100/B200", "NVLink (900GB/s)", "HBM3 Memory"], deepDive:{ content:"NVLink permite que GPUs falem entre si em velocidades absurdas.", code:"nvidia-smi topo -m" }}
    ]
  }
};

function App() {
  const [view, setView] = React.useState("pipeline");
  return (
    <div style={{minHeight:"100vh", background:"#080c14", color:"#e2e8f0"}}>
      <div style={{borderBottom:"1px solid #1e293b", padding:"24px", textAlign:"center"}}>
        <div style={{display:"flex", justifyContent:"center", gap:8, marginBottom:16}}>
          {["pipeline", "hpc"].map(v=>(
            <button key={v} onClick={()=>setView(v)} style={{
              padding:"6px 14px", background:view===v?"#1e293b":"none", border:"1px solid #1e293b",
              color:view===v?"#fff":"#475569", borderRadius:6, cursor:"pointer", fontWeight:600
            }}>{v==="pipeline"?"Básico":"Expert"}</button>
          ))}
        </div>
        <h1 style={{fontSize:24}}>{view==="pipeline"?"Guia de IA":"Engenharia HPC"}</h1>
      </div>
      <div style={{maxWidth:850, margin:"0 auto", padding:16}}>
        <Guide data={appData[view]} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
